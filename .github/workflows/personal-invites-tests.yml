name: Personal invitations - PostgreSQL tests
on:
  push:
    branches: [feature/personal-chat-invites]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contacts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: contacts_ci
          POSTGRES_PASSWORD: ephemeral_test_only
          POSTGRES_DB: contacts_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contacts_ci -d contacts_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://contacts_ci:ephemeral_test_only@127.0.0.1:5432/contacts_ci
      JWT_ACCESS_SECRET: ci-only-access-key-not-for-production-000000
      JWT_REFRESH_SECRET: ci-only-refresh-key-not-for-production-00000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: server
      - run: npm run migrate
        working-directory: server
      - name: Integration tests
        working-directory: server
        run: |
          set -o pipefail
          node --experimental-strip-types --test scripts/personal-invites.integration.test.mjs | tee contacts-results.tap
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: personal-invites-test-results
          path: server/contacts-results.tap
          if-no-files-found: warn
