name: Regional demo policy tests
on:
  push:
    branches: [feature/regional-demo-content]
  pull_request:
    paths:
      - 'server/src/seed/**'
      - 'server/scripts/regional-policy.test.mjs'
      - '.github/workflows/regional-demo-tests.yml'
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-strip-types --test server/scripts/regional-policy.test.mjs
