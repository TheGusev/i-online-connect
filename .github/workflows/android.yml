name: Android build

on:
  workflow_dispatch:
  push:
    branches: [prod]
    paths:
      - "android/**"
      - "android-web/**"
      - "capacitor.config.ts"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Capacitor sync
        run: npx cap sync android
      - name: Set version
        run: |
          VERSION_CODE=$((1000 + ${{ github.run_number }}))
          sed -i -E "s/versionCode[ =]+[0-9]+/versionCode ${VERSION_CODE}/" android/app/build.gradle
          sed -i -E "s/versionName[ =]+\"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -nE "versionCode|versionName|applicationId|targetSdk" android/app/build.gradle android/variables.gradle || true
      - name: Build AAB and APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace
      - name: Sign release files
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.p12"
          AAB=$(ls android/app/build/outputs/bundle/release/*.aab | head -1)
          jarsigner -keystore "$RUNNER_TEMP/upload.p12" -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            -sigalg SHA256withRSA -digestalg SHA-256 "$AAB" "$KEY_ALIAS"
          cp "$AAB" ya-online-google-play.aab
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -p -f 4 "$APK" aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/upload.p12" --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD --ks-key-alias "$KEY_ALIAS" --out ya-online-rustore.apk aligned.apk
          "$BT/apksigner" verify --print-certs ya-online-rustore.apk | head -3
          rm -f "$RUNNER_TEMP/upload.p12" aligned.apk
      - name: Collect unsigned files
        if: env.KEYSTORE_B64 == ''
        run: |
          cp android/app/build/outputs/bundle/release/*.aab ya-online-UNSIGNED.aab
          cp android/app/build/outputs/apk/release/*.apk ya-online-UNSIGNED.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ya-online-android
          path: |
            ya-online-google-play.aab
            ya-online-rustore.apk
            ya-online-UNSIGNED.aab
            ya-online-UNSIGNED.apk
          if-no-files-found: warn
          retention-days: 30
